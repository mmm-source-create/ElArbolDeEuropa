name: Validación
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validacion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    name: Tests y build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validar contratos de personas y cartografía
        run: npm run audit:data-contract
      - run: npm run audit:security
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/cartography/requirements.lock
      - name: Instalar y comprobar el entorno cartográfico aislado
        run: |
          python -m venv .venv-cartography
          .venv-cartography/bin/python -m pip install --require-hashes --only-binary=:all: -r scripts/cartography/requirements.lock
          .venv-cartography/bin/python -m pip check
          npm run cartography:check
      - name: Conservar fuentes, mapas y resultados revisados
        run: git diff --exit-code -- prototypes/euv-locations docs/reports/reviewed docs/atlas-continuity-audit.json docs/atlas-continuity-audit.md tests/baselines
      - run: npm run ssg:sample
      - name: Hidratar una muestra de fichas reales
        run: node --import ./tests/jsx-loader.mjs --test tests/hydration.test.mjs
        env:
          EADE_SSG_SAMPLE: .ssg-sample
      - name: Comprobar los datos regenerados
        run: node scripts/audits/audit-personas.mjs --fail-on-errors
