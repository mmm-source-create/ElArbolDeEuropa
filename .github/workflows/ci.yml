name: Validación
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validacion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    name: Tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:security
      - run: npm test
      - run: npm run build
      - run: npm run ssg:sample
      - name: Hidratar una muestra de fichas reales
        run: node --import ./tests/jsx-loader.mjs --test tests/hydration.test.mjs
        env:
          EADE_SSG_SAMPLE: .ssg-sample
      - name: Comprobar los datos regenerados
        run: node audit-personas.mjs --fail-on-errors
